<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NebulaChat - Masuk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="auth-box">
  <div class="logo">🌌</div>
  <h1>NebulaChat</h1>
  <p class="tagline">Terhubung melampaui batas</p>

  <div class="tabs">
    <button id="tabLogin" class="tab active">Masuk</button>
    <button id="tabRegister" class="tab">Daftar</button>
  </div>

  <form id="authForm">
    <input type="text" id="username" placeholder="Username" autocomplete="username" required>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" id="submitBtn">Masuk</button>
  </form>

  <p id="errorMsg" class="error"></p>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
</body>
</html>
